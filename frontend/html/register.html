<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotech - Registro</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        .register-container {
            width: min(400px, 100%);
        }
    </style>
</head>
<body>
    <main class="register-container">
        <div class="w3-card-4 vault-card w3-padding-large w3-round-large">
            <p class="w3-center w3-text-teal"><b>BIBLIOTECH</b></p>

            <h1 class="w3-center">Crear cuenta</h1>

            <p class="w3-center">Crea tu cuenta de Cliente</p>

            <form id="registerForm">
                <label for="username">Nombre de Usuario</label>
                <input
                    class="w3-input w3-border w3-round w3-transparent w3-text-white"
                    type="text"
                    id="username"
                    autocomplete="username"
                    required
                >

                <br>

                <label for="password">Contraseña (mínimo 6 caracteres)</label>
                <input
                    class="w3-input w3-border w3-round w3-transparent w3-text-white"
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <br>

                <button type="submit" class="w3-button w3-teal w3-block w3-round-large">
                    <b>REGISTRARSE</b>
                </button>
            </form>

            <p class="w3-small w3-center">
                ¿Ya tienes cuenta?
                <a href="/login" class="w3-text-teal">Inicia Sesión</a>
            </p>
        </div>
    </main>

    <script src="../js/services/api_service.js"></script>
    <script src="../js/components/ui_handlers.js"></script>
    <script src="../js/utils/auth_helper.js"></script>
    <script src="../js/front_controllers/auth_front_controller.js"></script>
</body>
</html>
